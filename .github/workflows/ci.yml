name: Website checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: docker build -t yoru:test .
      - run: |
          docker run -d --name yoru -p 8080:80 yoru:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health.json
          for page in index discover worlds characters journal collection muses atelier garden; do
            curl -fsS "http://localhost:8080/$page.html" > /dev/null
          done
