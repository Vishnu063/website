name: ANIMEVERSE quality and readiness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      formal_tests:
        description: Run the deferred formal suites
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
        if: github.event_name == 'workflow_dispatch' && inputs.formal_tests
      - run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit including build tools
        run: npm audit --json > dependency-audit.json
        continue-on-error: true
      - run: npm run build
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Actual database readiness
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:8080/api/health
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.formal_tests
      - run: npm run test:e2e
        if: github.event_name == 'workflow_dispatch' && inputs.formal_tests
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
      - name: Failure logs
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop lab
        if: always()
        run: docker compose down
