services:
  app:
    build: .
    init: true
    restart: unless-stopped
    volumes:
      - app-data:/app/.wrangler/state
      - app-backups:/app/backups
    expose: ['3000']
    stop_grace_period: 30s
  nginx:
    image: nginx:stable-alpine
    ports: ['8080:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app-data:
  app-backups:
